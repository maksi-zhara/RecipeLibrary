[project]
name = "recipelib"
version = "0.1.0"
description = "Библиотека рецептов — настольное приложение (TDD)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "PySide6>=6.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "freezegun>=1.5",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipelib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
qt_api = "pyside6"
markers = [
    "acceptance: приёмочные тесты по таблице трассировки (п.7 ТЗ)",
    "integration: тесты, затрагивающие SQLite или файловую систему",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PT", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
files = ["src"]
